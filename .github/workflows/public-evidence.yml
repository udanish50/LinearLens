name: Public evidence

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/public_suite/**"
      - "src/linearlens/web.py"
      - "tests/test_public_suite.py"
      - "tests/test_web_export.py"
      - "examples/web_export.py"
      - ".github/workflows/public-evidence.yml"
  pull_request:
    paths:
      - "benchmarks/public_suite/**"
      - "src/linearlens/web.py"
      - "tests/test_public_suite.py"
      - "tests/test_web_export.py"
      - "examples/web_export.py"
      - ".github/workflows/public-evidence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest pandas scikit-learn
      - run: python benchmarks/public_suite/verify_public_suite.py
      - run: pytest -q
